# ============================================================
# wacrm-free — full local/self-host stack, one command.
#
#   cp .env.local.example .env      # fill in Supabase + secrets
#   docker compose up -d --build
#
# Brings up:
#   • app              — the CRM (Next.js) on http://localhost:3000
#   • evolution-api    — the free WhatsApp gateway on http://localhost:8088
#   • evolution-postgres / evolution-redis — Evolution's own storage
#
# The app and Evolution share a network, so they reach each other by
# service name — no host.docker.internal needed. Supabase is external
# (create a free project and put the keys in .env).
#
# Variable substitution (${VAR}) below is read from the root .env file;
# the app's runtime environment is loaded from the same .env via env_file.
# ============================================================

name: wacrm-free

services:
  app:
    # No `build.args` here on purpose. Compose resolves ${VAR} in build args
    # while PARSING the file, before a platform like Coolify has generated
    # anything — and Coolify fails the deployment outright on build args,
    # in seconds, with an empty build log that gives no clue which line did
    # it. Local builds get their NEXT_PUBLIC_* args from
    # docker-compose.override.yml (see docker-compose.override.example.yml),
    # which a bare `docker compose up` auto-loads and an explicit `-f`
    # deploy ignores.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wacrm_free_app
    restart: unless-stopped
    # `expose`, not `ports`. A host port binding collides with the reverse
    # proxy that already holds :3000 ("port is already allocated") and, even
    # when free, routes around it — no TLS, no domain. Host ports for local
    # use live in the override.
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Inside the compose network the app reaches Evolution by service
      # name, and Evolution reaches the app back the same way — these
      # override the localhost/dev values in .env.
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_WEBHOOK_URL=http://app:3000/api/whatsapp/webhook
      # Bare keys, deliberately: this is how a platform is told which port
      # to route to (it reads the port out of the variable's NAME) and how
      # generated values are received. Writing `- APP_URL=${APP_URL:-}`
      # instead would create an EMPTY user variable that shadows the
      # generated one — worse than omitting the line.
      - SERVICE_FQDN_APP_3000
      - APP_URL
    depends_on:
      - evolution-api
    networks:
      - wacrm-net

  evolution-api:
    # Prebuilt, patched Evolution API (our fork, pinned to 2.3.7) published to
    # GHCR by the fork's CI. End users just pull it — no need to clone the
    # fork. The patches are normal code-level TypeScript edits and include:
    # WhatsApp Status posting/fanout + revoke sync, channel/newsletter posts,
    # message-receipt.update forwarding (status "seen by"), and pin/mute/star.
    #
    # Hacking on the gateway? Clone the fork as a sibling ../evolution-api and
    # build locally instead of pulling:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/elormcodes1/evolution-api:latest
    container_name: wacrm_evolution_api
    restart: unless-stopped
    depends_on:
      - evolution-redis
      - evolution-postgres
    # No host port. The app reaches the gateway in-network by service name,
    # so publishing one only exposes it on the server. The local override
    # binds 127.0.0.1:8088 for the manager UI (/manager) and curl.
    volumes:
      - evolution_instances:/evolution/instances
    # Config inlined here so the full-stack compose is self-contained (no
    # separate env file to copy). Only the gateway key comes from the root
    # .env — set EVOLUTION_API_KEY once; the app sends the same value.
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://localhost:8088
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME:-evolution}:${POSTGRES_PASSWORD:-evolution}@evolution-postgres:5432/${POSTGRES_DATABASE:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Re-emit history messages the gateway already has stored.
      #
      # Without this, a message stored while the app was restarting (or
      # whose webhook POST failed) is skipped by every later history sync
      # and can never be delivered — it sits in the gateway looking
      # healthy while the CRM has never seen it. Needs the patched image;
      # the webhook dedupes messages.set by message id, so re-emitting is
      # harmless.
      WEBHOOK_HISTORY_RESEND_STORED: "true"
      CONFIG_SESSION_PHONE_CLIENT: wacrm-free
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
    # Restarted automatically when the WhatsApp socket dies (see autoheal).
    labels:
      autoheal: "true"
    # The socket dies quietly and `connectionState` keeps reporting "open"
    # throughout, so an HTTP ping is worthless here — the gateway answered
    # every request while delivering no messages for hours. This makes the
    # socket actually do something: an onWhatsApp round-trip per instance
    # that CLAIMS to be connected. A logged-out instance is not a fault and
    # is skipped; an "open" one that cannot carry a request is exactly the
    # failure we are looking for.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const key = process.env.AUTHENTICATION_API_KEY;
          const base = 'http://127.0.0.1:8080';
          (async () => {
            const res = await fetch(base + '/instance/fetchInstances', { headers: { apikey: key } });
            const list = await res.json();
            for (const inst of list) {
              if (inst.connectionStatus !== 'open') continue;
              const probe = await fetch(base + '/chat/whatsappNumbers/' + inst.name, {
                method: 'POST',
                headers: { apikey: key, 'content-type': 'application/json' },
                body: JSON.stringify({ numbers: ['000000000000'] }),
              });
              if (!probe.ok) { console.error('dead socket:', inst.name, probe.status); process.exit(1); }
            }
            process.exit(0);
          })().catch((e) => { console.error('probe failed:', e.message); process.exit(1); });
      interval: 90s
      timeout: 30s
      retries: 3
      # Reconnecting after a restart takes a while; don't flap during it.
      start_period: 180s
    networks:
      - wacrm-net

  # Restarts containers Docker has marked unhealthy. Compose's `restart:`
  # policy does NOT cover unhealthy — only exits — so without this the
  # healthcheck above would detect a dead socket and do nothing about it,
  # which is where we were: the app could see the fault but had no way to
  # restart its own gateway.
  #
  # Needs the Docker socket, which is root-equivalent on the host. It is
  # mounted read-only and the image only ever restarts containers carrying
  # the `autoheal` label.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: wacrm_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  evolution-postgres:
    image: postgres:15-alpine
    container_name: wacrm_evolution_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=1000
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-evolution}
      - POSTGRES_USER=${POSTGRES_USERNAME:-evolution}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-evolution}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - wacrm-net

  evolution-redis:
    image: redis:7-alpine
    container_name: wacrm_evolution_redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - wacrm-net

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  wacrm-net:
    name: wacrm-free-net
    driver: bridge
